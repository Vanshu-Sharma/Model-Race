[project]
name = "model-race"
version = "0.1.0"
description = "Assignment 8 – classify 500 reviews with scikit-learn, cloud LLM, and Ollama"
readme = "README.md"
authors = [
    { name = "Vanshu Sharma", email = "vanshus528@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "google-genai>=2.34.0",
    "groq>=1.7.0",
    "httpx>=0.28.1",
    "pandas>=2.2.0",
    "python-dotenv>=1.2.4",
    "scikit-learn>=1.5.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F"]
ignore = ["E501"]
